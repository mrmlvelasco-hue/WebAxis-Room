{% extends "base_login.html" %}
{% block title %}Login | WebAXIS{% endblock %}

{% block content %}
<div class="loginpanel">

  <img src="{{ url_for('static', filename='img/webaxis_logo.png') }}" alt="AXIS Logo" class="login-logo">

  <form id="loginForm" style="width:100%">

    <input type="text" id="username"
           class="form-control"
           placeholder="Username" required autocomplete="username">

    <input type="password" id="password"
           class="form-control"
           placeholder="Password" required autocomplete="current-password">

    <button id="loginBtn" type="submit" class="btn btn-login w-100">
      Login
    </button>

  </form>

  <div class="login-footer">
    &copy; 2026 &ndash; Pepsi Cola Product Philippines, Inc.
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("loginForm");
  const btn  = document.getElementById("loginBtn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      Swal.fire({ icon: "warning", title: "Missing Information", text: "Please enter username and password." });
      return;
    }

    btn.disabled = true;

    Swal.fire({
      title: "Signing in...",
      html: "Authenticating with Active Directory",
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    try {
      const res  = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = data.redirect;
      } else {
        Swal.fire({ icon: "error", title: "Login Failed", text: data.message });
        btn.disabled = false;
      }
    } catch (err) {
      Swal.fire({ icon: "error", title: "System Error", text: "Unable to connect to server." });
      btn.disabled = false;
    }
  });

});
</script>
{% endblock %}
